[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["apps/backend"]
testpaths = ["apps/backend"]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
