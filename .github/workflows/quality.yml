name: quality

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: blandskron_signals
          POSTGRES_USER: blandskron
          POSTGRES_PASSWORD: blandskron-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blandskron -d blandskron_signals"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python manage.py check
        working-directory: apps/backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.local
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PASSWORD: blandskron-ci
      - run: python manage.py test
        working-directory: apps/backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.local
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PASSWORD: blandskron-ci
      - run: ruff check apps

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r apps/mcp-server/requirements.txt pytest ruff
      - run: pytest -q
        working-directory: apps/mcp-server
      - run: ruff check apps/mcp-server
